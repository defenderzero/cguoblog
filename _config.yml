# Hexo 站点配置
title: 我的博客
subtitle: 记录 · 分享 · 思考
description: 一个用 Hexo 搭建的免费个人博客，记录技术、生活与思考。
keywords: 博客,Hexo,技术,生活
author: 博主
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://defenderzero.github.io/cguoblog
root: /cguoblog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# 首页与分页
index_generator:
  path: ''
  per_page: 8
  order_by: -date
default_category: uncategorized
category_map:
  技术: tech
  生活: life
  随笔: essay
tag_map:
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'
per_page: 10
pagination_dir: page

# 扩展
theme: aurora
deploy:
  type: ''

# 归档
archive_generator:
  enabled: true
  per_page: 20
  yearly: true
  monthly: true
  daily: false

category_generator:
  per_page: 10
tag_generator:
  per_page: 10

# 搜索
search:
  path: search.xml
  field: post
  format: html
  content: true
  limit: 10000

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '

# 站点地图
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# 服务器
server:
  port: 4000
  compress: true
  header: true
